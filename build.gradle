plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArguments.addAll '--nogui' }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

// Когда будет jar Iron's Arms 'n Artifice, положи его в папку libs/ и раскомментируй:
// repositories { flatDir { dirs 'libs' } }
// dependencies { compileOnly name: 'irons_arms_n_artifice-1.21.1-1.1.0' }

tasks.withType(ProcessResources).configureEach {
    var props = [mod_id: mod_id, mod_version: mod_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}
